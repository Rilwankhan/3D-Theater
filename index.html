document.querySelectorAll(".sh").forEach(b=>b.onclick=()=>{st.sh=+b.dataset.s;document.querySelectorAll(".sh").forEach(x=>x.classList.toggle("on",x==b));$("#dinfo").textContent=TH[st.sh/5|0]+" · "+TM[st.sh%5];$("#dgo").disabled=false});go("movie",1)}
function skip(){$("#det").scrollIntoView({behavior:"smooth"})}
function trailer(ts){if(scrollY>innerHeight*.9)return;const m=M[st.m],c=$("#tc"),x=c.getContext("2d"),W=c.width,H=c.height,t=(ts-t0)/1000;
const g=x.createLinearGradient(0,0,W,H*(1+.3*Math.sin(t)));g.addColorStop(0,m[5][0]);g.addColorStop(1,m[5][1]);x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle="rgba(255,255,255,.07)";for(let i=0;i<7;i++){const b=((i*.17+t*.03)%1.2-.1)*W;x.beginPath();x.moveTo(b,0);x.lineTo(b+W*.08,0);x.lineTo(b-W*.2,H);x.lineTo(b-W*.28,H);x.fill()}
x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,0,W,H*.1);x.fillRect(0,H*.9,W,H*.1);
const L=["COMING THIS FRIDAY","A "+m[1].toUpperCase()+" ORIGINAL",m[0].toUpperCase(),"BOOK YOUR SEATS"],k=Math.min(3,t/3|0),u=t%3/3;
x.save();x.globalAlpha=Math.max(0,k==3?Math.min(1,u*5):Math.min(1,u*5,(1-u)*5));x.translate(W/2,H/2);x.scale(1+u*.08,1+u*.08);x.fillStyle="#fff";x.textAlign="center";
let fs=Math.round(W*(k==2?.1:.055));x.font="800 "+fs+"px Georgia,serif";while(x.measureText(L[k]).width>W*.88&&fs>10){fs--;x.font="800 "+fs+"px Georgia,serif"}x.fillText(L[k],0,fs/3);x.restore();
$("#pgb").style.width=Math.min(100,t/12*100)+"%";if(t>12&&!done){done=1;skip()}}
/* snacks + pay */
const qty=(i,d)=>{st.cart[i]=Math.max(0,(st.cart[i]||0)+d);$("#q"+i).textContent=st.cart[i];cartUI()};
const sum=()=>{const tix=st.seats.reduce((a,i)=>a+S[i].p,0),sn=SN.reduce((a,s,i)=>a+s[1]*(st.cart[i]||0),0),fee=st.seats.length*25;return{tix,sn,fee,all:tix+sn+fee}};
function cartUI(){const n=Object.values(st.cart).reduce((a,b)=>a+b,0);$("#cinfo").innerHTML=`<b>${n} item${n==1?"":"s"}</b> <span class="mu">₹${sum().sn}</span>`}
function renderSn(){$("#snl").innerHTML=SN.map((s,i)=>`<div class="sn"><div class="ph" style="background:linear-gradient(135deg,hsl(${i*47} 60% 38%),hsl(${i*47+40} 55% 22%))">${s[2]}</div><b>${s[0]}</b><span class="mu">₹${s[1]}</span><div class="q"><button onclick="qty(${i},-1)" aria-label="Remove">−</button><i id="q${i}">${st.cart[i]||0}</i><button onclick="qty(${i},1)" aria-label="Add">+</button></div></div>`).join("");cartUI()}
function renderPay(){const m=M[st.m],s=sum(),it=SN.map((x,i)=>st.cart[i]?`<div class="row"><span>${x[0]} × ${st.cart[i]}</span><span>₹${x[1]*st.cart[i]}</span></div>`:"").join("");
$("#pay").innerHTML=`<div class="pg"><h2>Review and pay</h2><div class="tk"><b>${m[0]}</b><div class="mu">${TH[st.sh/5|0]} · ${TM[st.sh%5]}</div><div class="row"><span>Seats ${st.seats.map(i=>S[i].n).join(", ")}</span><span>₹${s.tix}</span></div>${it}<div class="row"><span>Booking fee</span><span>₹${s.fee}</span></div><div class="row"><b>Total</b><b>₹${s.all}</b></div></div><button class="btn" style="width:100%" onclick="paid()">Pay ₹${s.all} (demo)</button></div>`}
function paid(){const m=M[st.m];$("#pay").innerHTML=`<div class="pg"><h2>Booking confirmed</h2><div class="tk"><b>${m[0]}</b><div class="mu">${TH[st.sh/5|0]} · ${TM[st.sh%5]}</div><div class="row"><span>Seats</span><b>${st.seats.map(i=>S[i].n).join(", ")}</b></div><div class="row"><span>Booking ID</span><b>VR${(Math.random()*9e6+1e6|0)}</b></div></div><button class="btn" style="width:100%" onclick="go('home')">Back to home</button></div>`}
/* loop */
$("#vb").innerHTML=VN.map(v=>`<button class="ch" data-k="${v[0]}">${v[1]}</button>`).join("");document.querySelectorAll("#vb button").forEach(b=>b.onclick=()=>setView(b.dataset.k));
let raf=0;function tick(){if(view=="home"||view=="seats"||view=="movie"){raf=requestAnimationFrame(tick);if(!document.hidden)frame(performance.now())}else raf=0}
function frame(ts){if(view=="home"){if(!ptr.size){ring.rotation.y+=vel-.0015;vel*=.93}scr.forEach(s=>{const k=Math.max(0,Math.cos(s.userData.a-ring.rotation.y));s.scale.setScalar(1+.22*Math.pow(k,8))});R.render(HS,HC)}
else if(view=="seats")hall();else trailer(ts)}
addEventListener("resize",()=>{if(view=="home")attach($("#hero"),1);if(view=="seats")attach($("#hall"),0)});
go("home");
</script></body></html>
